[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-planner"
version = "0.5.0"
description = "Local-first personal finance planning service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["finance_planner"]

[tool.coverage.report]
show_missing = true
skip_covered = false
