# Azure Artifacts Feed (for publishing):
#   https://msazure.pkgs.visualstudio.com/One/_packaging/azinsights_accia_pkgs/pypi/upload
#   (simple index: https://msazure.pkgs.visualstudio.com/One/_packaging/azinsights_accia_pkgs/pypi/simple/)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golazo-copilot"
version = "4.3.5"
description = "MCP server for Golazo Copilot workflow management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "github-copilot", "workflow", "golazo"]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
golazo-copilot = "golazo_copilot.server:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 260
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "F841"]
"src/golazo_copilot/server.py" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["golazo_copilot"]
