capabilities:
  - name: workflow-orchestration
    description: "Creates and initializes work items, then enforces profile-specific role sequences, output gates, and role context"
    key_files:
      - golazo-copilot/src/golazo_copilot/core/transitions.py
      - golazo-copilot/src/golazo_copilot/core/output_validator.py
      - golazo-copilot/src/golazo_copilot/tools/golazo_transition.py
      - golazo-copilot/src/golazo_copilot/tools/golazo_role_context.py
      - golazo-copilot/src/golazo_copilot/tools/golazo_create_workitem.py
      - golazo-copilot/src/golazo_copilot/bootstrap-instructions.md
      - golazo-copilot/tests/test_gcp_transition.py
      - golazo-copilot/tests/test_gcp055_profile_roles.py
      - golazo-copilot/tests/test_gcp0079_planner_offer.py
    contracts:
      - "golazo_create_workitem(work_item_id, profile, initial_role, workspace_path) -> dict"
      - "Planner may initialize only the first Complete-profile work item; POA remains the default"
      - "golazo_transition(work_item_id, role, force, workspace_path) -> dict"
      - "golazo_role_context(work_item_id, workspace_path) -> dict"
      - "Profiles: complete, express, spike"
    depends_on: []

  - name: capability-registry-management
    description: "Resolves, migrates, queries, validates, and reports the canonical workspace capability registry"
    key_files:
      - WorkItems/capabilities.yaml
      - golazo-copilot/src/golazo_copilot/tools/golazo_capabilities.py
      - golazo-copilot/src/golazo_copilot/tools/golazo_status.py
      - golazo-copilot/src/golazo_copilot/tools/golazo_create_workitem.py
      - golazo-copilot/tests/test_gcp_capabilities.py
      - golazo-copilot/tests/test_gcp0076_canonical_capability_registry.py
    contracts:
      - "Canonical registry path: WorkItems/capabilities.yaml"
      - "Legacy root capabilities.yaml is migration input only"
      - "golazo_capabilities(list|show|impact|validate) -> dict"
    depends_on:
      - workflow-orchestration

  - name: bootstrap-skill-installation
    description: "Installs packaged Golazo skills with confirmed defaults at workspace or user scope during full bootstrap"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/golazo_bootstrap.py
      - golazo-copilot/src/golazo_copilot/tools/ado_sync_skill.py
      - golazo-copilot/src/golazo_copilot/dispatch/paths.py
      - golazo-copilot/src/golazo_copilot/dispatch/registry.py
      - golazo-copilot/src/golazo_copilot/handlers/tools.py
      - golazo-copilot/src/golazo_copilot/formatters/results.py
      - golazo-copilot/src/golazo_copilot/skills/golazo-ado-sync/SKILL.md
      - golazo-copilot/src/golazo_copilot/skills/golazo-ado-sync/defaults.yaml
      - golazo-copilot/tests/test_gcp0072_skill_bootstrap.py
    contracts:
      - "golazo_bootstrap(install_ado_sync_skill, ado_sync_config_confirmed, ado_sync_config) -> dict"
      - "Workspace skill destination: .github/skills/golazo-ado-sync/"
      - "User skill destination: ~/.copilot/skills/golazo-ado-sync/"
      - "Bootstrap result skills[] reports name, scope, target_path, status, and configuration_source"
    depends_on:
      - capability-registry-management

  - name: project-finalization
    description: "Finalizes POA-closed work items and advances global project state without bypassing closure gates"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/golazo_transition_workitem.py
      - golazo-copilot/src/golazo_copilot/dispatch/registry.py
      - golazo-copilot/tests/test_gcp0074_transition_workitem_closure.py
      - golazo-copilot/tests/test_gcp_transition_workitem.py
    contracts:
      - "golazo_transition_workitem(work_item_id, workspace_path) -> dict"
      - "Requires completed Retrospective history and POA closure evidence"
      - "Advances global_state.json to the next sequential work item"
    depends_on:
      - workflow-orchestration

  - name: release-policy-guidance
    description: "Defines forward-only documentation, versioning, changelog, build, commit, and push ownership"
    key_files:
      - golazo-copilot/src/golazo_copilot/roles/defaults/documenter.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/builder.md
      - golazo-copilot/tests/test_gcp0066_documenter_changelog_policy.py
      - golazo-copilot/tests/test_gcp0075_release_order_policy.py
      - golazo-copilot/README.md
      - golazo-copilot/pyproject.toml
    contracts:
      - "Documenter reviews non-release implementation documentation"
      - "Builder owns versioning, changelog, build, commit, and push"
      - "pyproject.toml is the canonical PEP 440 version source"
    depends_on:
      - workflow-orchestration

