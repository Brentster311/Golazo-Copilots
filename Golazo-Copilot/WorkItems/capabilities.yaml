# Golazo Copilot — Capability Registry Template
#
# This file maps project capabilities to their key files, contracts,
# and dependencies. The Golazo workflow uses it for impact analysis.
#
# Usage:
#   golazo_capabilities(action="list")       — summary of all capabilities
#   golazo_capabilities(action="show", capability="<name>")  — full card
#   golazo_capabilities(action="impact", files=["path/to/file.py"])
#   golazo_capabilities(action="validate")   — check key_files exist
#
# Schema:
#   capabilities:          (required) list of capability objects
#     - name:              (required) unique identifier, e.g. "user-auth"
#       description:       (optional) what this capability does
#       key_files:         (optional) list of file paths that define it
#       contracts:         (optional) list of API/data contracts it exposes
#       depends_on:        (optional) list of capability names it depends on

capabilities:
  # ── Example capability (replace with your own) ──────────────────────
  - name: bootstrap-skill-installation
    description: "Installs packaged Golazo skills with confirmed defaults at workspace or user scope during full bootstrap"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/golazo_bootstrap.py
      - golazo-copilot/src/golazo_copilot/tools/ado_sync_skill.py
      - golazo-copilot/src/golazo_copilot/dispatch/paths.py
      - golazo-copilot/src/golazo_copilot/dispatch/registry.py
      - golazo-copilot/src/golazo_copilot/handlers/tools.py
      - golazo-copilot/src/golazo_copilot/formatters/results.py
      - golazo-copilot/src/golazo_copilot/skills/golazo-ado-sync/SKILL.md
      - golazo-copilot/src/golazo_copilot/skills/golazo-ado-sync/defaults.yaml
      - golazo-copilot/tests/test_gcp0072_skill_bootstrap.py
    contracts:
      - "golazo_bootstrap(install_ado_sync_skill, ado_sync_config_confirmed, ado_sync_config) -> dict"
      - "Workspace skill destination: .github/skills/golazo-ado-sync/"
      - "User skill destination: ~/.copilot/skills/golazo-ado-sync/"
      - "Bootstrap result skills[] reports name, scope, target_path, status, and configuration_source"
    depends_on: []

