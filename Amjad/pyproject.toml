[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ees"
version = "0.1.0"
description = "Expert system that reverse-engineers incidents into troubleshooting rules"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "azure-identity>=1.15",
    "ruamel.yaml>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ees = "ees.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
