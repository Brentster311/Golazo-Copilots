# Golazo Copilot — Capability Registry Template
#
# This file maps project capabilities to their key files, contracts,
# and dependencies. The Golazo workflow uses it for impact analysis.
#
# Usage:
#   gcp_capabilities(action="list")       — summary of all capabilities
#   gcp_capabilities(action="show", capability="<name>")  — full card
#   gcp_capabilities(action="impact", files=["path/to/file.py"])
#   gcp_capabilities(action="validate")   — check key_files exist
#
# Schema:
#   capabilities:          (required) list of capability objects
#     - name:              (required) unique identifier, e.g. "user-auth"
#       description:       (optional) what this capability does
#       key_files:         (optional) list of file paths that define it
#       contracts:         (optional) list of API/data contracts it exposes
#       depends_on:        (optional) list of capability names it depends on

capabilities:
  - name: data-models
    description: "Core data models: Fact, Rule, RuleConditions, RuleThen, Incident, Ontology, RootCause, LLMResponse"
    key_files:
      - src/ees/models.py
    contracts:
      - "Fact.parse(text) -> Fact | None"
      - "Fact.to_dict() -> dict"
      - "Fact.from_dict(d) -> Fact"
      - "Fact.match_key() -> tuple"
      - "Rule.to_dict() -> dict"
      - "Rule.from_dict(d) -> Rule"
      - "Rule.is_duplicate_of(other) -> bool"
    depends_on: []

  - name: yaml-persistence
    description: "YAML file I/O for incidents, rules, ontology, and root causes"
    key_files:
      - src/ees/yaml_store.py
    contracts:
      - "YamlStore.save_rule(rule) -> Path"
      - "YamlStore.load_rule(rule_id) -> Rule"
      - "YamlStore.list_rules() -> list[Rule]"
      - "YamlStore.next_rule_id() -> str"
      - "YamlStore.save_incident(incident) -> Path"
      - "YamlStore.load_incident(incident_id) -> Incident"
    depends_on:
      - data-models

  - name: fact-extraction
    description: "Azure OpenAI LLM integration for extracting facts from incidents"
    key_files:
      - src/ees/fact_extractor.py
    contracts:
      - "FactExtractor.extract(text, ontology_nouns) -> LLMResponse"
    depends_on:
      - data-models

  - name: rule-generation
    description: "Rule deduplication and filtering of LLM-proposed rules"
    key_files:
      - src/ees/rule_generator.py
    contracts:
      - "RuleGenerator.is_duplicate(rule) -> bool"
      - "RuleGenerator.filter_rules(llm_rules, confirmed_facts) -> list[Rule]"
    depends_on:
      - data-models

  - name: ontology-management
    description: "Ontology CRUD with case-insensitive matching"
    key_files:
      - src/ees/ontology_manager.py
    contracts:
      - "OntologyManager.update_from_facts(facts) -> list[tuple]"
    depends_on:
      - data-models

  - name: incident-loading
    description: "File validation and text loading for incidents"
    key_files:
      - src/ees/incident_loader.py
    contracts:
      - "IncidentLoader.load(path) -> str"
    depends_on: []

  - name: cli-orchestration
    description: "CLI entry point and main workflow orchestration"
    key_files:
      - src/ees/main.py
    contracts:
      - "process_incident(incident_path, data_dir) -> None"
      - "evaluate_facts(facts_str, facts_file, data_dir, output_file) -> None"
      - "main() -> None"
    depends_on:
      - data-models
      - yaml-persistence
      - fact-extraction
      - rule-generation
      - ontology-management
      - incident-loading
      - rule-evaluation

  - name: rule-evaluation
    description: "Forward-chaining rule evaluation engine"
    key_files:
      - src/ees/rule_evaluator.py
    contracts:
      - "RuleEvaluator.evaluate(input_facts) -> EvaluationResult"
    depends_on:
      - data-models

  - name: gui
    description: "Desktop Tkinter GUI for incident processing, knowledge base browsing, and rule evaluation"
    key_files:
      - src/ees/gui/app.py
      - src/ees/gui/adapters.py
      - src/ees/gui/workers.py
    contracts:
      - "EESApp(data_dir) — main application class"
      - "facts_to_rows, rules_to_rows, ontology_to_tree, eval_result_to_display, filter_rules — adapter functions"
      - "run_in_worker(func, on_complete, on_error) — background worker"
    depends_on:
      - data-models
      - yaml-persistence
      - fact-extraction
      - rule-generation
      - ontology-management
      - incident-loading
      - rule-evaluation
