# Golazo Copilot — Capability Registry Template
#
# This file maps project capabilities to their key files, contracts,
# and dependencies. The Golazo workflow uses it for impact analysis.
#
# Usage:
#   gcp_capabilities(action="list")       — summary of all capabilities
#   gcp_capabilities(action="show", capability="<name>")  — full card
#   gcp_capabilities(action="impact", files=["path/to/file.py"])
#   gcp_capabilities(action="validate")   — check key_files exist
#
# Schema:
#   capabilities:          (required) list of capability objects
#     - name:              (required) unique identifier, e.g. "user-auth"
#       description:       (optional) what this capability does
#       key_files:         (optional) list of file paths that define it
#       contracts:         (optional) list of API/data contracts it exposes
#       depends_on:        (optional) list of capability names it depends on

capabilities:

  # ── Core data model & persistence ───────────────────────────────────
  - name: state-model
    description: "Pydantic types for work-item state (WorkItemState, Deviation, RoleHistoryEntry)"
    key_files:
      - golazo-copilot/src/golazo_copilot/core/types.py
    contracts:
      - "WorkItemState — schema_version, work_item_id, profile, current_phase, current_role, role_history, deviations"
      - "Deviation — id, action, reason, role, timestamp, consumed"
      - "RoleHistoryEntry — role, entered_at, exited_at"
    depends_on: []

  - name: persistence
    description: "Atomic JSON read/write for work-item state files"
    key_files:
      - golazo-copilot/src/golazo_copilot/core/persistence.py
    contracts:
      - "save_state(work_item_id, state, work_items_dir) -> None  # atomic write"
      - "load_state(work_item_id, work_items_dir) -> WorkItemState"
      - "work_item_exists(work_item_id, work_items_dir) -> bool"
      - "get_state_path(work_item_id, work_items_dir) -> Path"
    depends_on:
      - state-model

  # ── Transition & validation logic ───────────────────────────────────
  - name: transitions
    description: "Role ordering, phase mapping, and forward/backward transition validation"
    key_files:
      - golazo-copilot/src/golazo_copilot/core/transitions.py
    contracts:
      - "ROLE_ORDER — canonical list of 9 roles"
      - "TRANSITIONS — allowed next-roles per role"
      - "validate_transition(current, target) -> (bool, error)"
      - "is_backward_transition(current, target) -> bool"
      - "get_phase_for_role(role) -> 'definition'|'development'|'completion'"
    depends_on: []

  - name: output-validation
    description: "Parse Required Outputs from role files and validate file/dir/git artefacts"
    key_files:
      - golazo-copilot/src/golazo_copilot/core/output_validator.py
    contracts:
      - "parse_required_outputs(role_content, work_item_id) -> list[OutputSpec]"
      - "validate_all_outputs(specs, workspace_path) -> ValidationResult"
      - "OutputSpec — type ('file'|'dir'|'git-branch'|'git-log'), path_or_pattern"
    depends_on: []

  # ── Role system ─────────────────────────────────────────────────────
  - name: role-loader
    description: "Load role instructions with local-override priority over package defaults"
    key_files:
      - golazo-copilot/src/golazo_copilot/roles/loader.py
      - golazo-copilot/src/golazo_copilot/roles/defaults/project-owner-assistant.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/program-manager.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/quality-assurance.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/architect.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/developer.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/refactor-expert.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/builder.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/documenter.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/retrospective.md
      - golazo-copilot/src/golazo_copilot/roles/defaults/TechBestPractices.md
    contracts:
      - "load_role_instructions(role, project_root) -> str  # local > default"
      - "get_role_content(role, project_root) -> str"
      - "has_local_role_override(role, project_root) -> bool"
    depends_on: []

  # ── MCP tools ───────────────────────────────────────────────────────
  - name: tool-create-workitem
    description: "Create a new work item with initial state and role instructions"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_create_workitem.py
    contracts:
      - "gcp_create_workitem(work_item_id, profile, work_items_dir, project_root) -> dict"
    depends_on:
      - state-model
      - persistence
      - role-loader

  - name: tool-transition
    description: "Transition between workflow roles with gate enforcement and consent checks"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_transition.py
    contracts:
      - "gcp_transition(work_item_id, role, work_items_dir, project_root, force, force_without_notes) -> dict"
      - "get_role_notes_path(work_item_id, role, work_items_dir) -> Path"
      - "check_role_notes_exist(work_item_id, role, work_items_dir) -> bool"
    depends_on:
      - persistence
      - transitions
      - output-validation
      - role-loader
      - tool-consent

  - name: tool-status
    description: "Comprehensive workflow status: progress, outputs, stale-file detection, registry hints"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_status.py
    contracts:
      - "gcp_status(work_item_id, work_items_dir, project_root) -> dict"
      - "_get_stale_files(workspace_root) -> list[dict]"
      - "_get_registry_hint(workspace_root) -> str | None"
      - "_compute_role_progress(state) -> dict"
    depends_on:
      - persistence
      - output-validation
      - transitions
      - role-loader
      - tool-transition

  - name: tool-consent
    description: "Record and validate Project Owner consent for workflow deviations"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_consent.py
    contracts:
      - "gcp_consent(work_item_id, action, reason, work_items_dir) -> dict"
      - "has_valid_consent(state, action) -> bool"
      - "consume_consent(state, action) -> str | None"
    depends_on:
      - state-model
      - persistence

  - name: tool-bootstrap
    description: "Scaffold a workspace with copilot instructions, role files, and capabilities template"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_bootstrap.py
      - golazo-copilot/src/golazo_copilot/bootstrap-instructions.md
      - golazo-copilot/src/golazo_copilot/capabilities-template.yaml
    contracts:
      - "gcp_bootstrap(workspace_path, force, include_roles) -> dict  # files_created, files_skipped"
    depends_on:
      - role-loader

  - name: tool-capabilities
    description: "Query the capability registry for listing, detail, impact analysis, and validation"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_capabilities.py
    contracts:
      - "gcp_capabilities(action, capability, files, workspace_path) -> dict"
      - "action='list'   -> {capabilities: [{name, description}]}"
      - "action='show'   -> {capability: {name, description, key_files, contracts, depends_on, depended_on_by}}"
      - "action='impact' -> {directly_affected, transitively_affected}  # BFS transitive"
      - "action='validate' -> {results: [{name, valid, missing_files}]}"
    depends_on: []

  # ── Server (MCP entry point) ────────────────────────────────────────
  - name: mcp-server
    description: "MCP server entry point — registers all tools, routes calls, formats responses"
    key_files:
      - golazo-copilot/src/golazo_copilot/server.py
      - golazo-copilot/src/golazo_copilot/__init__.py
    contracts:
      - "list_tools() -> list[Tool]  # 7 tools registered"
      - "call_tool(name, arguments) -> list[TextContent]"
    depends_on:
      - tool-create-workitem
      - tool-transition
      - tool-status
      - tool-bootstrap
      - tool-consent
      - tool-capabilities
      - tool-role-context

  - name: tool-role-context
    description: "Assemble a self-contained context bundle for a role — instructions, state, input artifacts, previous notes"
    key_files:
      - golazo-copilot/src/golazo_copilot/tools/gcp_role_context.py
    contracts:
      - "gcp_role_context(work_item_id, role?, work_items_dir, project_root?, max_bundle_size?) -> dict"
      - "Result keys: status, bundle, artifact_count, total_size, truncated, role, work_item_id"
    depends_on:
      - persistence
      - role-loader
      - transitions
      - tool-transition
