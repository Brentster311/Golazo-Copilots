[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golazo-copilot"
version = "2.100.7"
description = "MCP server for Golazo Copilot workflow management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "github-copilot", "workflow", "golazo"]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
golazo-copilot = "golazo_copilot.server:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
