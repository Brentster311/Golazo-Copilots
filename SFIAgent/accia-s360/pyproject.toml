[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accia-s360"
version = "0.1.0"
description = "Python client for Microsoft S360 API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ACCIA Team", email = "accia@microsoft.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["s360", "microsoft", "api", "client", "azure"]
dependencies = [
    "azure-identity>=1.15.0,<2.0.0",
    "azure-core>=1.28.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "build>=1.0.0",
]

[project.urls]
Repository = "https://dev.azure.com/msazure/One/_git/ACCIA-S360"
Documentation = "https://dev.azure.com/msazure/One/_git/ACCIA-S360"

[tool.hatch.build.targets.sdist]
include = [
    "/src/accia_s360",
]

[tool.hatch.build.targets.wheel]
packages = ["src/accia_s360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/accia_s360"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
