[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfi-reporter"
version = "0.2.0"
description = "Desktop app to view SFI/QEI action items"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ACCIA Team", email = "accia@microsoft.com"},
]
dependencies = [
    "accia-s360>=0.1.0",
    "github-copilot-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]
[project.scripts]
sfi-reporter = "sfi_reporter.tk_app:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src/sfi_reporter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sfi_reporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
