[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop"
version = "0.1.0"
description = "Basic reusable agent loop package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = { find = { include = ["agent_loop*"] } }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
